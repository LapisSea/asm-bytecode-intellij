# Builds the plugin when a GitHub release is published and attaches it to the release.
# The zip is what IntelliJ installs (Settings | Plugins | Install Plugin from Disk) and what Marketplace takes.

name: Release plugin

on:
  release:
    types: [ published ]

jobs:
  build:
    
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload to the release
    
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    
    # A release tagged 1.0.0 or v1.0.0 must build version 1.0.0, so the zip is not mislabeled
    - name: Check the version matches the tag
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version=$(./gradlew properties -q | sed -n 's/^version: //p')
        if [ "${TAG#v}" != "$version" ]; then
          echo "::error::Release tag $TAG does not match the project version $version in build.gradle"
          exit 1
        fi
    
    - name: Build and verify
      run: ./gradlew build verifyPlugin
    
    - name: Upload to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$TAG" build/distributions/*.zip --clobber
